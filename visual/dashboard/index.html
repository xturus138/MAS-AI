<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>MAS AI</title>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #fff;
    color: #111;
    width: 520px;
    height: 480px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header strip */
  header {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 12px;
    border-bottom: 1px solid #f0f0f0;
    flex-shrink: 0;
  }
  .dot { width:7px; height:7px; border-radius:50%; background:#d1d5db; }
  .dot.live { background:#22c55e; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  header span { font-size:.75rem; font-weight:600; color:#111; }
  #conn { font-size:.68rem; color:#bbb; margin-left:auto; }

  /* Body */
  .body { display:flex; flex:1; overflow:hidden; }

  /* Left — device */
  #dev {
    width:200px; flex-shrink:0;
    background:#fafafa;
    border-right:1px solid #f0f0f0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  #dev-frame { width:100%; height:100%; border:none; display:none; }
  #no-dev {
    text-align:center; color:#ccc; font-size:.7rem; line-height:2;
    user-select:none; padding:12px;
  }
  #no-dev svg { display:block; margin:0 auto 8px; }

  /* Right — info */
  #right {
    flex:1; display:flex; flex-direction:column;
    padding:14px 16px; gap:14px; overflow:hidden;
  }

  /* Counter */
  .big { font-size:2.4rem; font-weight:700; line-height:1; }
  .big .of { font-size:1.1rem; color:#bbb; font-weight:400; }
  .label { font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:#bbb; margin-bottom:3px; }

  /* Bar */
  .track { height:5px; background:#f0f0f0; border-radius:99px; overflow:hidden; }
  .fill  { height:100%; background:#111; border-radius:99px; width:0%; transition:width .4s ease; }
  .meta  { display:flex; justify-content:space-between; font-size:.67rem; color:#bbb; margin-top:4px; }

  /* Card */
  #card {
    border:1px solid #f0f0f0; border-radius:8px;
    padding:10px 12px;
  }
  #tcs { font-size:.85rem; font-weight:600; }
  #badge {
    display:inline-block; margin-top:5px;
    padding:1px 8px; border-radius:99px;
    font-size:.65rem; font-weight:600;
    background:#f3f4f6; color:#9ca3af;
  }
  #badge.run  { background:#eff6ff; color:#2563eb; }
  #badge.pass { background:#dcfce7; color:#16a34a; }
  #badge.fail { background:#fee2e2; color:#dc2626; }

  /* Updates */
  #feed { display:flex; flex-direction:column; gap:5px; overflow:hidden; }
  .fi {
    font-size:.72rem; color:#555; display:flex; gap:6px;
    animation: fd .2s ease;
  }
  @keyframes fd { from{opacity:0;transform:translateY(2px)} to{opacity:1} }
  .fi .t { color:#ccc; flex-shrink:0; }
</style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <span>MAS AI</span>
  <span id="conn">Connecting…</span>
</header>

<div class="body">

  <div id="dev">
    <div id="no-dev">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.3">
        <rect x="5" y="2" width="14" height="20" rx="2"/>
        <circle cx="12" cy="17.5" r=".6" fill="currentColor"/>
      </svg>
      Device screen
    </div>
    <iframe id="dev-frame"></iframe>
  </div>

  <div id="right">

    <div>
      <div class="label">Test Cases</div>
      <div class="big">
        <span id="nd">—</span><span class="of"> / <span id="nt">—</span></span>
      </div>
    </div>

    <div>
      <div class="track"><div class="fill" id="bar"></div></div>
      <div class="meta"><span id="pct">0%</span><span id="eta"></span></div>
    </div>

    <div id="card">
      <div class="label">Running</div>
      <div id="tcs">Waiting…</div>
      <span id="badge"></span>
    </div>

    <div id="feed"></div>

  </div>
</div>

<script>
const WS_PORT     = (window.DASHBOARD_WS_PORT     || 9765);
const SCRCPY_PORT = (window.DASHBOARD_SCRCPY_PORT || 8000);
const dot = document.getElementById('dot');
let t0 = null;

function connect() {
  const ws = new WebSocket(`ws://localhost:${WS_PORT}`);
  ws.onopen  = () => { dot.className='dot live'; document.getElementById('conn').textContent='Live'; };
  ws.onclose = () => { dot.className='dot'; document.getElementById('conn').textContent='Reconnecting…'; setTimeout(connect,2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => handle(JSON.parse(e.data));
}
connect();

(function poll() {
  fetch(`http://localhost:${SCRCPY_PORT}/player.html`,{mode:'no-cors'})
    .then(()=>{ const f=document.getElementById('dev-frame'); f.src=`http://localhost:${SCRCPY_PORT}/player.html`; f.style.display='block'; document.getElementById('no-dev').style.display='none'; })
    .catch(()=>setTimeout(poll,5000));
})();

function handle(m) {
  if (m.type==='progress') prog(m);
  else if (m.type==='log') add(m.message);
}

function prog(m) {
  if (!t0 && m.scenario_idx>0) t0=Date.now();
  const done=m.scenario_idx||0, tot=m.scenario_total||0;
  const pct=tot?Math.round(done/tot*100):0;
  document.getElementById('nd').textContent=done||'—';
  document.getElementById('nt').textContent=tot||'—';
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('pct').textContent=pct+'%';
  if (done>0&&tot>0&&done<tot) {
    const rem=Math.round((Date.now()-t0)/done/1000*(tot-done));
    document.getElementById('eta').textContent=`~${Math.floor(rem/60)?Math.floor(rem/60)+'m ':''}${rem%60}s`;
  } else if (done>=tot&&tot>0) document.getElementById('eta').textContent='Done ✓';

  if (m.tcs_id) {
    document.getElementById('tcs').textContent=m.tcs_id;
    const b=document.getElementById('badge'), st=(m.status||'').toUpperCase();
    if (st==='RUNNING')            { b.textContent='Running';      b.className='run'; }
    else if (st==='PASSED')        { b.textContent='Passed ✓';    b.className='pass'; add(m.tcs_id+' passed ✓'); }
    else if (st.includes('ANOMALY')||st.includes('FAIL')) { b.textContent='Needs review'; b.className='fail'; add(m.tcs_id+' — needs review ⚠'); }
    else                           { b.textContent=m.status||'';  b.className=''; }
  }
}

const feed=document.getElementById('feed');
function add(msg) {
  const d=document.createElement('div'); d.className='fi';
  const now=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  d.innerHTML=`<span>${esc(msg)}</span><span class="t">${now}</span>`;
  feed.prepend(d);
  while(feed.children.length>3) feed.removeChild(feed.lastChild);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>

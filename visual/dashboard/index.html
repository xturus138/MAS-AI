<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MAS AI</title>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f8f9fa;
    color: #1a1a1a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ───────────────────────────────────────────────── */
  header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #d1d5db; flex-shrink: 0;
    transition: background .4s;
  }
  .dot.live { background: #22c55e; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
  header h1 { font-size: .9rem; font-weight: 600; color: #111; }
  #conn-label { font-size: .75rem; color: #9ca3af; margin-left: auto; }

  /* ── Layout ────────────────────────────────────────────────── */
  .body { display: flex; flex: 1; overflow: hidden; }

  /* ── Left: device screen ───────────────────────────────────── */
  #device-panel {
    width: 280px; flex-shrink: 0;
    background: #fff;
    border-right: 1px solid #e5e7eb;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  #device-frame { width:100%; height:100%; border:none; display:none; }
  #no-device {
    text-align: center; color: #c4c9d4;
    font-size: .8rem; line-height: 2; padding: 24px;
    user-select: none;
  }
  #no-device svg { display:block; margin: 0 auto 10px; }

  /* ── Right: progress ───────────────────────────────────────── */
  #right {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; padding: 40px 48px; gap: 28px;
  }

  /* Big counter */
  .counter-label {
    font-size: .72rem; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #9ca3af; margin-bottom: 6px;
  }
  .counter-value {
    font-size: 4rem; font-weight: 700; line-height: 1; color: #111;
  }
  .counter-value .denom { font-size: 1.8rem; color: #9ca3af; font-weight: 400; }

  /* Bar */
  .bar-track {
    height: 8px; background: #f3f4f6;
    border-radius: 99px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; background: #111; border-radius: 99px;
    width: 0%; transition: width .5s ease;
  }
  .bar-meta {
    display: flex; justify-content: space-between;
    font-size: .75rem; color: #9ca3af; margin-top: 6px;
  }

  /* Current test */
  #card {
    background: #fff; border: 1px solid #e5e7eb;
    border-radius: 10px; padding: 16px 18px;
  }
  #card .clabel {
    font-size: .68rem; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: #9ca3af; margin-bottom: 6px;
  }
  #tcs-id { font-size: .95rem; font-weight: 600; color: #111; }
  #badge {
    display: inline-block; margin-top: 8px;
    padding: 2px 10px; border-radius: 99px;
    font-size: .72rem; font-weight: 600;
    background: #f3f4f6; color: #6b7280;
  }
  #badge.run  { background: #eff6ff; color: #2563eb; }
  #badge.pass { background: #dcfce7; color: #16a34a; }
  #badge.fail { background: #fee2e2; color: #dc2626; }

  /* Updates (max 4 lines, QA-friendly) */
  #updates { display: flex; flex-direction: column; gap: 6px; }
  .uitem {
    display: flex; align-items: baseline; gap: 8px;
    font-size: .8rem; color: #374151;
    animation: fi .25s ease;
  }
  @keyframes fi { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
  .utime { color: #c4c9d4; font-size: .7rem; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <h1>MAS AI</h1>
  <span id="conn-label">Connecting…</span>
</header>

<div class="body">

  <div id="device-panel">
    <div id="no-device">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.2">
        <rect x="5" y="2" width="14" height="20" rx="2"/>
        <circle cx="12" cy="17.5" r=".6" fill="currentColor"/>
      </svg>
      Device screen
    </div>
    <iframe id="device-frame"></iframe>
  </div>

  <div id="right">

    <div>
      <div class="counter-label">Test Cases</div>
      <div class="counter-value">
        <span id="n-done">—</span>
        <span class="denom"> / <span id="n-total">—</span></span>
      </div>
    </div>

    <div>
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
      <div class="bar-meta">
        <span id="pct">0%</span>
        <span id="eta"></span>
      </div>
    </div>

    <div id="card">
      <div class="clabel">Currently Running</div>
      <div id="tcs-id">Waiting to start…</div>
      <span id="badge"></span>
    </div>

    <div id="updates"></div>

  </div>
</div>

<script>
// Ports injected by config.js (written by Python on start)
const WS_PORT     = window.DASHBOARD_WS_PORT     || 9765;
const SCRCPY_PORT = window.DASHBOARD_SCRCPY_PORT  || 8000;

const dot = document.getElementById('dot');
let startTime = null;

// ── WebSocket ─────────────────────────────────────────────────
let ws;
function connect() {
  ws = new WebSocket(`ws://localhost:${WS_PORT}`);
  ws.onopen  = () => { dot.className = 'dot live'; document.getElementById('conn-label').textContent = 'Live'; };
  ws.onclose = () => { dot.className = 'dot'; document.getElementById('conn-label').textContent = 'Reconnecting…'; setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => handle(JSON.parse(e.data));
}
connect();

// ── Device iframe ─────────────────────────────────────────────
(function tryDevice() {
  fetch(`http://localhost:${SCRCPY_PORT}/player.html`, {mode:'no-cors'})
    .then(() => {
      const f = document.getElementById('device-frame');
      f.src = `http://localhost:${SCRCPY_PORT}/player.html`;
      f.style.display = 'block';
      document.getElementById('no-device').style.display = 'none';
    })
    .catch(() => setTimeout(tryDevice, 4000));
})();

// ── Events ───────────────────────────────────────────────────
function handle(msg) {
  if (msg.type === 'progress') updateProgress(msg);
  else if (msg.type === 'log') addUpdate(msg.message);
}

function updateProgress(m) {
  if (!startTime && m.scenario_idx > 0) startTime = Date.now();
  const done  = m.scenario_idx  || 0;
  const total = m.scenario_total || 0;
  const pct   = total ? Math.round(done / total * 100) : 0;

  document.getElementById('n-done').textContent  = done  || '—';
  document.getElementById('n-total').textContent = total || '—';
  document.getElementById('bar').style.width     = pct + '%';
  document.getElementById('pct').textContent     = pct + '%';

  if (done > 0 && total > 0 && done < total) {
    const rem = Math.round((Date.now() - startTime) / done / 1000 * (total - done));
    const m2 = Math.floor(rem / 60), s2 = rem % 60;
    document.getElementById('eta').textContent = `~${m2 > 0 ? m2 + 'm ' : ''}${s2}s left`;
  } else if (done >= total && total > 0) {
    document.getElementById('eta').textContent = 'Done ✓';
  }

  if (m.tcs_id) {
    document.getElementById('tcs-id').textContent = m.tcs_id;
    const badge = document.getElementById('badge');
    const st = (m.status || '').toUpperCase();
    if (st === 'RUNNING') { badge.textContent = 'Running'; badge.className = 'run'; }
    else if (st === 'PASSED') {
      badge.textContent = 'Passed ✓'; badge.className = 'pass';
      addUpdate(`${m.tcs_id} — passed ✓`);
    } else if (st.includes('ANOMALY') || st.includes('FAIL')) {
      badge.textContent = 'Needs review'; badge.className = 'fail';
      addUpdate(`${m.tcs_id} — flagged for review ⚠`);
    } else {
      badge.textContent = m.status || ''; badge.className = '';
    }
  }
}

// QA-friendly updates — no tech noise
const feed = document.getElementById('updates');
function addUpdate(msg) {
  const el = document.createElement('div');
  el.className = 'uitem';
  const t = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'});
  el.innerHTML = `<span>${esc(msg)}</span><span class="utime">${t}</span>`;
  feed.prepend(el);
  while (feed.children.length > 4) feed.removeChild(feed.lastChild);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>

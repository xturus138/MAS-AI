<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MAS AI — Live Dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f1117;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{background:#1a1d2e;padding:10px 16px;display:flex;align-items:center;
         gap:12px;border-bottom:1px solid #2d3148;flex-shrink:0}
  header h1{font-size:1rem;font-weight:600;letter-spacing:.05em;color:#a5b4fc}
  #status-dot{width:10px;height:10px;border-radius:50%;background:#ef4444;flex-shrink:0}
  #status-dot.connected{background:#22c55e;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  #status-text{font-size:.75rem;color:#94a3b8}
  .main{display:flex;flex:1;overflow:hidden;gap:0}

  /* ── Left: device video ─────────────────────────────────────────── */
  #video-panel{position:relative;width:360px;min-width:260px;flex-shrink:0;
               background:#000;display:flex;align-items:center;justify-content:center;
               border-right:1px solid #2d3148}
  #device-video{width:100%;height:100%;object-fit:contain}
  #overlay-canvas{position:absolute;top:0;left:0;width:100%;height:100%;
                  pointer-events:none}
  #no-video{position:absolute;color:#475569;font-size:.8rem;text-align:center;
            padding:16px;user-select:none}

  /* ── Right: log + progress ──────────────────────────────────────── */
  #right-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}

  /* Progress bar */
  #progress-panel{background:#1a1d2e;padding:12px 16px;border-bottom:1px solid #2d3148;
                  flex-shrink:0}
  #progress-title{font-size:.8rem;color:#94a3b8;margin-bottom:6px}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .bar-label{font-size:.72rem;color:#64748b;width:90px;flex-shrink:0}
  .bar-track{flex:1;height:8px;background:#1e2235;border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width .4s ease;background:#6366f1}
  .bar-fill.step{background:#22c55e}
  .bar-pct{font-size:.72rem;color:#94a3b8;width:32px;text-align:right;flex-shrink:0}
  #progress-tcs{font-size:.78rem;color:#a5b4fc;margin-top:4px}

  /* Activity feed */
  #feed-header{padding:8px 16px;font-size:.75rem;color:#64748b;border-bottom:1px solid #1e2235;
               flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
  #feed{flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
  .feed-item{display:flex;gap:8px;padding:4px 8px;border-radius:4px;font-size:.74rem;
             line-height:1.4;align-items:flex-start}
  .feed-item:hover{background:#1e2235}
  .feed-ts{color:#475569;flex-shrink:0;font-variant-numeric:tabular-nums;width:56px}
  .feed-badge{flex-shrink:0;font-size:.65rem;padding:1px 5px;border-radius:3px;
              font-weight:600;text-transform:uppercase;margin-top:1px}
  .badge-observer{background:#1d3a5f;color:#60a5fa}
  .badge-decider{background:#2d1f5e;color:#a78bfa}
  .badge-executor{background:#1a3a2a;color:#4ade80}
  .badge-reflector{background:#3a2020;color:#f87171}
  .badge-progress{background:#1e2a1e;color:#86efac}
  .badge-system{background:#232323;color:#94a3b8}
  .feed-msg{color:#cbd5e1;flex:1}
  .feed-detail{color:#64748b;font-size:.70rem;margin-top:1px;word-break:break-all}
  #clear-btn{font-size:.7rem;color:#475569;cursor:pointer;background:none;border:none;
             padding:2px 6px;border-radius:3px}
  #clear-btn:hover{background:#1e2235;color:#94a3b8}
</style>
</head>
<body>
<header>
  <div id="status-dot"></div>
  <h1>MAS AI — Live Dashboard</h1>
  <span id="status-text">Connecting…</span>
</header>

<div class="main">
  <!-- Left: device screen -->
  <div id="video-panel">
    <video id="device-video" autoplay muted playsinline></video>
    <canvas id="overlay-canvas"></canvas>
    <div id="no-video">
      Device screen stream will appear here<br>
      once ws-scrcpy connects to the device.
    </div>
  </div>

  <!-- Right: progress + feed -->
  <div id="right-panel">
    <div id="progress-panel">
      <div id="progress-title">Batch Progress</div>
      <div class="bar-row">
        <span class="bar-label">Scenario</span>
        <div class="bar-track"><div class="bar-fill" id="bar-scenario" style="width:0%"></div></div>
        <span class="bar-pct" id="pct-scenario">—</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Step</span>
        <div class="bar-track"><div class="bar-fill step" id="bar-step" style="width:0%"></div></div>
        <span class="bar-pct" id="pct-step">—</span>
      </div>
      <div id="progress-tcs">Waiting for run to start…</div>
    </div>

    <div id="feed-header">
      <span>Activity Feed</span>
      <button id="clear-btn" onclick="clearFeed()">Clear</button>
    </div>
    <div id="feed"></div>
  </div>
</div>

<script>
const WS_PORT = 9765;      // DashboardServer port (Python)
const SCRCPY_PORT = 8000;  // scrcpy-relay Node server port

// ── WebSocket connection to DashboardServer ──────────────────────────
const dot  = document.getElementById('status-dot');
const stxt = document.getElementById('status-text');
let ws;

function connect() {
  ws = new WebSocket(`ws://localhost:${WS_PORT}`);
  ws.onopen  = () => { dot.className = 'connected'; stxt.textContent = 'Connected'; };
  ws.onclose = () => { dot.className = ''; stxt.textContent = 'Reconnecting…';
                       setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => handle(JSON.parse(e.data));
}
connect();

// ── ws-scrcpy video stream (MSE / WebCodecs path) ────────────────────
// ws-scrcpy-web exposes the device stream at ws://localhost:SCRCPY_PORT
// via its own WebSocket. We use its built-in video element if it opens
// in an iframe, or connect via MSE here. For simplicity we open its UI
// inside the video panel as an iframe overlay.
const noVideo = document.getElementById('no-video');
const videoEl = document.getElementById('device-video');

function tryScrcpyIframe() {
  const panel = document.getElementById('video-panel');
  const iframe = document.createElement('iframe');
  // Point to scrcpy-relay's Broadway player page
  iframe.src = `http://localhost:${SCRCPY_PORT}/player.html`;
  iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:0;z-index:1;background:#000';
  iframe.onload = () => { noVideo.style.display = 'none'; };
  panel.appendChild(iframe);
}
// Give ws-scrcpy-web a moment to start, then try to load it
setTimeout(tryScrcpyIframe, 3000);

// ── Overlay canvas (widget boxes from observer/decider) ───────────────
const canvas = document.getElementById('overlay-canvas');
const ctx = canvas.getContext('2d');
let _widgets = [], _target = {}, _ripple = null;

function resizeCanvas() {
  const p = document.getElementById('video-panel');
  canvas.width = p.clientWidth; canvas.height = p.clientHeight;
  drawOverlay();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawOverlay() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  _widgets.forEach(b => {
    if (!b || b.length < 4) return;
    const [x1,y1,x2,y2] = scaleBox(b);
    ctx.strokeStyle = 'rgba(99,102,241,.7)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x1, y1, x2-x1, y2-y1);
  });
  if (_target && _target.bounds) {
    const [x1,y1,x2,y2] = scaleBox(_target.bounds);
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x1, y1, x2-x1, y2-y1);
  }
  if (_ripple) {
    ctx.beginPath();
    ctx.arc(_ripple.x, _ripple.y, 18, 0, Math.PI*2);
    ctx.fillStyle = `rgba(34,197,94,${_ripple.alpha/255*.5})`;
    ctx.fill();
  }
}

// Rough device→canvas scale (assumes 1080×2400 device; adjust if needed)
const DEV_W = 1080, DEV_H = 2400;
function scaleBox(b) {
  const sw = canvas.width/DEV_W, sh = canvas.height/DEV_H;
  return [b[0]*sw, b[1]*sh, b[2]*sw, b[3]*sh];
}

// ── Event handler ─────────────────────────────────────────────────────
function handle(msg) {
  switch(msg.type) {
    case 'observer':
      _widgets = (msg.widgets||[]).map(w=>w.bounds).filter(Boolean);
      _target = {};
      drawOverlay();
      log('observer', `${_widgets.length} widgets detected`, '', 'observer');
      break;
    case 'decider':
      _target = msg.target || {};
      drawOverlay();
      log('decider', `Target: ${_target.label||'?'} (${_target.action||'?'})`, '', 'decider');
      break;
    case 'executor':
      _ripple = {x: msg.x*(canvas.width/DEV_W), y: msg.y*(canvas.height/DEV_H), alpha:255};
      drawOverlay();
      setTimeout(()=>{ _ripple=null; drawOverlay(); }, 600);
      log('executor', `${msg.action} @ (${msg.x},${msg.y})`, msg.scroll, 'executor');
      break;
    case 'clear':
      _widgets=[]; _target={}; _ripple=null; drawOverlay(); break;
    case 'progress':
      updateProgress(msg); break;
    case 'log':
      log(msg.message, msg.detail, msg.ts, msg.component.toLowerCase()); break;
  }
}

// ── Progress bars ─────────────────────────────────────────────────────
function updateProgress(m) {
  const sp = m.scenario_total ? Math.round(m.scenario_idx/m.scenario_total*100) : 0;
  const st = m.step_total     ? Math.round(m.step_idx/m.step_total*100)         : 0;
  document.getElementById('bar-scenario').style.width = sp+'%';
  document.getElementById('bar-step').style.width     = st+'%';
  document.getElementById('pct-scenario').textContent = `${m.scenario_idx}/${m.scenario_total}`;
  document.getElementById('pct-step').textContent     = `${m.step_idx}/${m.step_total}`;
  document.getElementById('progress-tcs').textContent =
    m.tcs_id ? `${m.tcs_id}  —  ${m.status}` : 'Waiting…';
  log(`Scenario ${m.scenario_idx}/${m.scenario_total} · Step ${m.step_idx}/${m.step_total}`,
      m.tcs_id, m.ts, 'progress');
}

// ── Activity feed ─────────────────────────────────────────────────────
const feed = document.getElementById('feed');
const MAX_ITEMS = 300;

function log(msg, detail='', ts='', component='system') {
  const comp = component.toLowerCase();
  const badge = ['observer','decider','executor','reflector','progress','system']
    .find(c => comp.includes(c)) || 'system';
  const item = document.createElement('div');
  item.className = 'feed-item';
  item.innerHTML = `
    <span class="feed-ts">${ts || now()}</span>
    <span class="feed-badge badge-${badge}">${badge}</span>
    <div><div class="feed-msg">${esc(msg)}</div>${detail?`<div class="feed-detail">${esc(detail)}</div>`:''}</div>`;
  feed.appendChild(item);
  if (feed.children.length > MAX_ITEMS) feed.removeChild(feed.firstChild);
  feed.scrollTop = feed.scrollHeight;
}

function clearFeed() { feed.innerHTML = ''; }
function now() { return new Date().toLocaleTimeString('en',{hour12:false}); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

log('Dashboard ready', `ws://localhost:${WS_PORT}`, now(), 'system');
</script>
</body>
</html>

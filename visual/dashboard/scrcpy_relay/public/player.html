<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Device Screen — MAS AI</title>
<style>
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;
       height:100vh;overflow:hidden}
  canvas{max-width:100%;max-height:100%;object-fit:contain}
  #msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);
       background:rgba(0,0,0,.7);color:#94a3b8;font:12px/1.4 monospace;
       padding:6px 12px;border-radius:6px;pointer-events:none}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="msg">Connecting to device stream…</div>

<!-- Broadway.js: H.264 software decoder (WASM), no plugins needed -->
<script src="https://cdn.jsdelivr.net/npm/broadway-player@0.1.5/dist/broadway.min.js"></script>
<script>
const canvas = document.getElementById('screen');
const msg    = document.getElementById('msg');
const WS_PORT = location.port || '8000';

// Broadway player (H.264 → canvas)
const player = new Decoder({ useWorker: true, reuseMemory: false });
player.onPictureDecoded = (buffer, width, height) => {
  canvas.width  = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(width, height);
  img.data.set(new Uint8Array(buffer));
  ctx.putImageData(img, 0, 0);
};

let ws;
function connect() {
  ws = new WebSocket(`ws://${location.hostname}:${WS_PORT}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen  = () => { msg.textContent = 'Streaming…'; };
  ws.onclose = () => { msg.textContent = 'Disconnected. Retrying…'; setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => player.decode(new Uint8Array(e.data));
}
connect();
</script>
</body>
</html>
